<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <!-- Title -->
  <title>Smart Planner | Smart Productivity & Task Management App</title>

  <!-- SEO -->
  <meta
    name="description"
    content="Smart Planner is a smart productivity and task management application that helps you organize tasks, set reminders, track progress, schedule work, and improve daily productivity."
  />

  <meta
    name="keywords"
    content="Smart Planner, Productivity App, Task Manager, Todo App, Task Tracker, Reminder App, Daily Planner, Project Management, Smart Management System, Productivity Dashboard"
  />

  <meta name="author" content="Kanchan Gupta" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="application-name" content="Smart Planner" />
  <meta name="generator" content="React + Vite" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="color-scheme" content="light dark" />

  <!-- Canonical -->
  <link rel="canonical" href="https://yourdomain.com/" />

  <!-- Language -->
  <link
    rel="alternate"
    hreflang="en"
    href="https://yourdomain.com/"
  />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/image.png" />
  <link rel="apple-touch-icon" href="/image.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Performance: DNS + Preconnect -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
    fetchpriority="high"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
    fetchpriority="high"
  />

  <!-- Fonts: Non-render-blocking load via media=print trick -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    />
  </noscript>

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Smart Planner" />

  <meta
    property="og:description"
    content="Organize tasks, manage reminders, analyze productivity, and stay focused with Smart Planner."
  />

  <meta property="og:url" content="https://yourdomain.com/" />

  <meta property="og:site_name" content="Smart Planner" />

  <meta
    property="og:image"
    content="https://yourdomain.com/image.png"
  />

  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Smart Planner"
  />

  <meta
    name="twitter:description"
    content="Smart Productivity & Task Management Application."
  />

  <meta
    name="twitter:image"
    content="https://yourdomain.com/image.png"
  />

  <!-- PWA -->
  <meta
    name="mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"WebApplication",
    "name":"Smart Planner",
    "url":"https://yourdomain.com/",
    "applicationCategory":"ProductivityApplication",
    "operatingSystem":"Web",
    "description":"Smart productivity and task management application with reminders, reports, analytics, and scheduling.",
    "image":"https://yourdomain.com/image.png",
    "creator":{
      "@type":"Person",
      "name":"Kanchan Gupta"
    }
  }
  </script>

</head>

<body>

  <noscript>
    Smart Planner requires JavaScript to run.
  </noscript>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
